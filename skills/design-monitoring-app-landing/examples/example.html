<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring app landing pages</title>
<style>
*{box-sizing:border-box}
body{max-width:52rem;margin:2rem auto;padding:0 1rem;font:1rem/1.55 system-ui,sans-serif;background:#171629;color:#f6f2ff}
button{font:inherit;padding:.5rem .75rem;border:1px solid #a69aee;color:inherit;background:#37315e;border-radius:.55rem;cursor:pointer;margin:.2rem}
button[aria-pressed=true]{background:#c0afff;color:#1d1735}
:focus-visible{outline:3px solid #f4d9ff;outline-offset:3px}
article{border:1px solid #8177ad;background:#2b2946;padding:1rem;border-radius:1rem}
.enhanced article:not(.active){display:none}.cards{margin-block:1rem}.primary{display:inline-block;color:#d0c4ff;margin-bottom:1rem}
</style>
<script defer src="example.js"></script>
</head>
<body>
<main>
<h1>See risks before a deadline</h1>
<p>Use the preview to compare the three statuses your team can act on.</p>
<a class="primary" href="#preview">Open the interactive preview</a>
<section id="preview" aria-label="Monitoring app landing pages"><div class="controls" role="group" aria-label="Preview steps"><button type="button" data-step="0" aria-pressed="true">On track</button><button type="button" data-step="1" aria-pressed="false">Needs review</button><button type="button" data-step="2" aria-pressed="false">Blocked</button></div><div class="cards"><article data-panel="0"><h2>On track</h2><p>All milestones have owners and dates.</p></article>
<article data-panel="1"><h2>Needs review</h2><p>The draft is due today and still needs an owner.</p></article>
<article data-panel="2"><h2>Blocked</h2><p>Publish is blocked by an unresolved approval.</p></article></div><p id="status" aria-live="polite"></p></section>
</main>
</body>
</html>
