<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seamless marquees example</title>
  <style>
*{box-sizing:border-box}body{max-width:60rem;margin:2rem auto;padding:0 1rem;background:#18172d;color:#f5f2ff;font:1rem/1.55 system-ui,sans-serif}h1{line-height:1.08}a{color:#d8cdff}button{font:inherit;color:#f5f2ff;background:#392e64;padding:.55rem .8rem;border:1px solid #9a88d6;border-radius:.5rem;cursor:pointer}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid #e1ceff;outline-offset:3px}.panel{padding:1.2rem;border:1px solid #666085;border-radius:1rem;background:#24223c}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.window{overflow:hidden;max-width:30rem}.track{display:flex;width:max-content}.track ul{display:flex;list-style:none;margin:1rem 0;padding:0}.track li{padding:.6rem 1.2rem;border:1px solid #575582;margin-inline-end:.5rem;white-space:nowrap}.running .track{animation:marquee 13s linear infinite}#belt.paused .track{animation-play-state:paused}@keyframes marquee{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){#belt .track{animation:none;width:auto}.track ul{flex-wrap:wrap}.track ul[aria-hidden],#pause{display:none}}
  </style>
  <script defer src="example.js"></script>
</head>
<body>
  <main>
    <h1>Seamless marquees</h1>
    <div id="belt"><button id="pause" type="button" aria-pressed="false">Pause marquee</button><div class="window"><div class="track"><ul><li>Atlas</li><li>Beacon</li><li>Contour</li><li>Draft</li><li>Frame</li><li>Grain</li></ul><ul aria-hidden="true"><li>Atlas</li><li>Beacon</li><li>Contour</li><li>Draft</li><li>Frame</li><li>Grain</li></ul></div></div></div>
  </main>
</body>
</html>
