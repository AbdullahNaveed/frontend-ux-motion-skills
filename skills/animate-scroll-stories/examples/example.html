<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sticky scroll stories example</title>
  <style>
*{box-sizing:border-box}body{max-width:60rem;margin:2rem auto;padding:0 1rem;background:#18172d;color:#f5f2ff;font:1rem/1.55 system-ui,sans-serif}h1{line-height:1.08}a{color:#d8cdff}button{font:inherit;color:#f5f2ff;background:#392e64;padding:.55rem .8rem;border:1px solid #9a88d6;border-radius:.5rem;cursor:pointer}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid #e1ceff;outline-offset:3px}.panel{padding:1.2rem;border:1px solid #666085;border-radius:1rem;background:#24223c}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.3rem}.readout{position:sticky;top:1rem;align-self:start}.step{min-height:46vh;margin-block:1rem;scroll-margin-top:1rem}@media(max-width:560px){.story{display:block}.readout{display:none}.step{min-height:auto}}
  </style>
  <script defer src="example.js"></script>
</head>
<body>
  <main>
    <h1>Sticky scroll stories</h1>
    <nav aria-label="Story steps"><a href="#draft">Draft</a> · <a href="#review">Review</a> · <a href="#publish">Publish</a></nav><div class="story"><div class="panel readout" aria-hidden="true">Draft preview</div><div><section class="panel step" id="draft"><h2>Draft</h2><p>Outline the page.</p></section><section class="panel step" id="review"><h2>Review</h2><p>Ask for feedback.</p></section><section class="panel step" id="publish"><h2>Publish</h2><p>Release the approved page.</p></section></div></div>
  </main>
</body>
</html>
