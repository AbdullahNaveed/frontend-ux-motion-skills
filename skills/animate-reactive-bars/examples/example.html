<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reactive bar illustrations example</title>
  <style>
*{box-sizing:border-box}body{max-width:60rem;margin:2rem auto;padding:0 1rem;background:#18172d;color:#f5f2ff;font:1rem/1.55 system-ui,sans-serif}h1{line-height:1.08}a{color:#d8cdff}button{font:inherit;color:#f5f2ff;background:#392e64;padding:.55rem .8rem;border:1px solid #9a88d6;border-radius:.5rem;cursor:pointer}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid #e1ceff;outline-offset:3px}.panel{padding:1.2rem;border:1px solid #666085;border-radius:1rem;background:#24223c}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.histogram{width:min(100%,32rem);box-sizing:border-box;height:14rem;display:flex;align-items:end;gap:4%}.histogram i{flex:1;height:var(--height);border-radius:.35rem .35rem 0 0;background:#a895ff;transform:scaleY(var(--stretch,1));transform-origin:bottom;transition:transform 160ms ease}@media(prefers-reduced-motion:reduce){.histogram i{transition:none}}
  </style>
  <script defer src="example.js"></script>
</head>
<body>
  <main>
    <h1>Reactive bar illustrations</h1>
    <p>Illustrative activity across six weeks.</p><div class="histogram panel" aria-hidden="true"><i style="--height:30%"></i><i style="--height:59%"></i><i style="--height:47%"></i><i style="--height:69%"></i><i style="--height:57%"></i><i style="--height:76%"></i></div>
  </main>
</body>
</html>
